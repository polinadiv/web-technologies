<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="weather-container">
    <div class="weather-header">
        <div class="location-title">New York, NY</div>
        <div class="current-date">Tuesday, April 15th</div>
        <div class="current-condition">Overcast</div>

        <div class="current-main-info">
            <div class="temperature-block">
                <img src="icons/cloud.png" alt="Overcast" class="main-icon">
                <span class="temperature">58<span class="unit">°F</span></span>
            </div>
            <div class="details-list">
                <div>Precipitation: <span class="detail-value">100%</span></div>
                <div>Humidity: <span class="detail-value">97%</span></div>
                <div>Wind: <span class="detail-value">4 mph SW</span></div>
                <div>Pollen Count: <span class="detail-value">36</span></div>
            </div>
        </div>
    </div>

    <hr class="divider">

    <div class="forecast-list">
        <div class="forecast-item">
            <div class="day-name">Today</div>
            <div class="forecast-icon">
                <img src="icons/stormy.png" alt="Storm">
            </div>
            <div class="forecast-temp">
                <span class="temp-high">68°</span>
                <span class="temp-low">36°</span>
            </div>
            <div class="forecast-pollen">Pollen 36</div>
        </div>

        <div class="forecast-item">
            <div class="day-name">Wednesday</div>
            <div class="forecast-icon">
                <img src="icons/sunny.png" alt="Sunny">
            </div>
            <div class="forecast-temp">
                <span class="temp-high">50°</span>
                <span class="temp-low">39°</span>
            </div>
            <div class="forecast-pollen">Pollen 36</div>
        </div>

        <div class="forecast-item">
            <div class="day-name">Thursday</div>
            <div class="forecast-icon">
                <img src="icons/sunny.png" alt="Sunny">
            </div>
            <div class="forecast-temp">
                <span class="temp-high">55°</span>
                <span class="temp-low">39°</span>
            </div>
            <div class="forecast-pollen">Pollen 36</div>
        </div>

        <div class="forecast-item">
            <div class="day-name">Friday</div>
            <div class="forecast-icon">
                <img src="icons/partly-cloudy.png" alt="Partly Cloudy">
            </div>
            <div class="forecast-temp">
                <span class="temp-high">54°</span>
                <span class="temp-low">43°</span>
            </div>
            <div class="forecast-pollen">Pollen 36</div>
        </div>

        <div class="forecast-item">
            <div class="day-name">Saturday</div>
            <div class="forecast-icon">
                <img src="icons/rainy.png" alt="Storm">
            </div>
            <div class="forecast-temp">
                <span class="temp-high">64°</span>
                <span class="temp-low">46°</span>
            </div>
            <div class="forecast-pollen">Pollen 36</div>
        </div>

        <div class="forecast-item">
            <div class="day-name">Sunday</div>
            <div class="forecast-icon">
                <img src="icons/rainy.png" alt="Storm">
            </div>
            <div class="forecast-temp">
                <span class="temp-high">64°</span>
                <span class="temp-low">50°</span>
            </div>
            <div class="forecast-pollen">Pollen 36</div>
        </div>

        <div class="forecast-item">
            <div class="day-name">Monday</div>
            <div class="forecast-icon">
                <img src="icons/partly-cloudy.png" alt="Partly Cloudy">
            </div>
            <div class="forecast-temp">
                <span class="temp-high">61°</span>
                <span class="temp-low">50°</span>
            </div>
            <div class="forecast-pollen">Pollen 36</div>
        </div>
    </div>
</div>

</body>
</html>
