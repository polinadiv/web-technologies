<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Попап без JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body">

<header class="header">
    <div class="header-right">
        <a href="#" class="header-link" tabindex="0">Mail</a>
        <a href="#" class="header-link" tabindex="0">Images</a>

        <input type="checkbox" id="popup-toggle" class="popup-checkbox popup-toggle-input">
        <input type="checkbox" id="more-toggle" class="popup-checkbox more-toggle-input">

        <label for="popup-toggle" class="popup-button" tabindex="0" title="Google apps">
            <span class="popup-button-icon">⠿</span>
        </label>

        <div class="notification-button" tabindex="0" title="Notifications">
            <span class="notification-icon">🔔</span>
        </div>

        <div class="user-profile" tabindex="0">
            <span class="user-avatar-placeholder">👤</span>
        </div>

        <div class="popup-container" tabindex="0">
            <div class="popup-grid">
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-blue">📅</span>
                    <span class="popup-item-text">Calendar</span>
                </a>
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-red">✉️</span>
                    <span class="popup-item-text">Mail</span>
                </a>
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-yellow">📰</span>
                    <span class="popup-item-text">News</span>
                </a>
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-green">📍</span>
                    <span class="popup-item-text">Map</span>
                </a>
                <a href="#" class="popup-item active-item" tabindex="0">
                    <span class="popup-item-icon icon-yellow">📁</span>
                    <span class="popup-item-text">Files</span>
                </a>
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-green">📇</span>
                    <span class="popup-item-text">Contacts</span>
                </a>
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-blue">🌐</span>
                    <span class="popup-item-text">Translate</span>
                </a>
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-red">▶️</span>
                    <span class="popup-item-text">Videos</span>
                </a>
                <a href="#" class="popup-item" tabindex="0">
                    <span class="popup-item-icon icon-blue">🔍</span>
                    <span class="popup-item-text">Search</span>
                </a>
            </div>

            <div class="popup-more-content">
                <div class="popup-grid">
                    <a href="#" class="popup-item" tabindex="0">
                        <span class="popup-item-icon icon-blue">🖼️</span>
                        <span class="popup-item-text">Photos</span>
                    </a>
                    <a href="#" class="popup-item" tabindex="0">
                        <span class="popup-item-icon icon-red">🧩</span>
                        <span class="popup-item-text">Apps</span>
                    </a>
                    <a href="#" class="popup-item" tabindex="0">
                        <span class="popup-item-icon icon-yellow">📄</span>
                        <span class="popup-item-text">Documents</span>
                    </a>
                    <a href="#" class="popup-item" tabindex="0">
                        <span class="popup-item-icon icon-green">💬</span>
                        <span class="popup-item-text">Chat</span>
                    </a>
                    <a href="#" class="popup-item" tabindex="0">
                        <span class="popup-item-icon icon-orange">🎓</span>
                        <span class="popup-item-text">Classroom</span>
                    </a>
                    <a href="#" class="popup-item" tabindex="0">
                        <span class="popup-item-icon icon-blue">🔖</span>
                        <span class="popup-item-text">Collection</span>
                    </a>
                    <a href="#" class="popup-item" tabindex="0">

                    <a href="#" class="popup-item" tabindex="0">
                        <span class="popup-item-icon icon-blue">📢</span>
                        <span class="popup-item-text">Promos</span>
                    </a>
                </div>
            </div>

            <label for="more-toggle" class="popup-more-btn" tabindex="0">
                <span class="btn-text-more">More</span>
                <span class="btn-text-less">Even more from Kottans</span>
            </label>
        </div>
    </div>

</html>
