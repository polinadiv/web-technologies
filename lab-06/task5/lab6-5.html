<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5 - Ефекти та накладання</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="weather-container">
    <div class="nav-arrows">
        <button class="arrow-btn"><img src="img/arrow-left.png" alt="Назад"></button>
        <button class="arrow-btn"><img src="img/arrow-right.png" alt="Вперед"></button>
    </div>

    <div class="main-card">
        <img src="img/cloud.png" alt="Хмара" class="weather-image">
        <div class="temperature">17</div>
    </div>

    <div class="forecast-card">
        <div class="day">
            <span class="day-name">Mon</span>
            <span class="day-temp">17°</span>
        </div>
        <div class="day">
            <span class="day-name">Tue</span>
            <span class="day-temp">19°</span>
        </div>
        <div class="day">
            <span class="day-name">Wed</span>
            <span class="day-temp">16°</span>
        </div>
        <div class="day">
            <span class="day-name">Thu</span>
            <span class="day-temp">18°</span>
        </div>
        <div class="day">
            <span class="day-name">Fri</span>
            <span class="day-temp">21°</span>
        </div>
    </div>
</div>

</body>
</html>
