<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mondrian Composition</title>
</head>
<body bgcolor="#ffffff">
<center>
    <h1>Композиція Мондріана</h1>

<table border="0" cellspacing="5" cellpadding="0" bgcolor="#111111">
    <tr>
        <td rowspan="2" bgcolor="#ffffff" width="50" height="50"></td>
        <td bgcolor="#ffffff" width="135" height="50">
            <table bgcolor="#ffffff" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td bgcolor="#ffffff" width="93" height="50"></td>
                    <td bgcolor="#ffffff" width="25" height="50"></td>
                </tr>
            </table>
        </td>
        <td colspan="2" bgcolor="#ffffff" width="135" height="50"></td>
        <td colspan="2" bgcolor="#f7dc1e" width="148" height="50"></td>
    </tr>

    <tr>
        <td colspan="3" rowspan="4" bgcolor="#ee4b2b" width="270" height="265"></td>
        <td colspan="2" rowspan="2" bgcolor="#f7dc1e" width="148" height="130"></td>
    </tr>

    <tr>
        <td bgcolor="#ffffff" width="50" height="65">
            <table border="0" cellspacing="0" cellpadding="0">
                <tr><td bgcolor="#ffffff" width="50" height="25"></td></tr>
                <tr><td bgcolor="#111111" width="50" height="15"></td></tr>
                <tr><td bgcolor="#ffffff" width="50" height="25"></td></tr>
            </table>
        </td>
    </tr>

    <tr>
        <td bgcolor="#ffffff" width="50" height="70"></td>
        <td rowspan="2" bgcolor="#ffffff" width="75" height="135"></td>
        <td rowspan="2" bgcolor="#ffffff" width="73" height="135"></td>
    </tr>

    <tr>
        <td bgcolor="#ffffff" width="50" height="65"></td>
    </tr>

    <tr>
        <td rowspan="2" bgcolor="#f7dc1e" width="50" height="200"></td>
        <td bgcolor="#ffffff" width="135" height="135">
            <!-- 2x2 dark cluster -->
            <table border="0" cellspacing="3" cellpadding="0" bgcolor="#111111">
                <tr>
                    <td bgcolor="#1c1c1c" width="64" height="64"></td>
                    <td bgcolor="#1c1c1c" width="64" height="64"></td>
                </tr>
                <tr>
                    <td bgcolor="#1c1c1c" width="64" height="64"></td>
                    <td bgcolor="#1c1c1c" width="64" height="64"></td>
                </tr>
            </table>
        </td>
        <td bgcolor="#ffffff" width="65" height="135"></td>
        <td bgcolor="#ffffff" width="70" height="135"></td>
        <td colspan="2" bgcolor="#dddddd" width="148" height="135"></td>
    </tr>

    <tr>
        <td bgcolor="#ffffff" width="135" height="65"></td>
        <td colspan="2" bgcolor="#111111" width="135" height="65"></td>
        <td colspan="2" bgcolor="#0d47a1" width="148" height="65"></td>
    </tr>
</table>
    <p>
        <a href="../index.html">Повернутись на головну</a>
    </p>
</center>
</body>

</html>
