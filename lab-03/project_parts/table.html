<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 - Таблиця</title>
</head>
<body>

<div align="center">

    <h1>Завдання 1: Таблиця</h1>

    <table border="2" bordercolor="black" cellpadding="0" cellspacing="0" width="400" height="400">
        <tbody>
        <tr height="0">
            <td width="50"></td>
            <td width="50"></td>
            <td width="50"></td>
            <td width="50"></td>
            <td width="50"></td>
            <td width="50"></td>
            <td width="50"></td>
            <td width="50"></td>
        </tr>

        <tr height="50">
            <td colspan="8" bgcolor="#20e8c0"></td>
        </tr>

        <tr height="50">
            <td rowspan="6" bgcolor="#fffbdc"></td>
            <td colspan="6" bgcolor="#20e8c0"></td>
            <td rowspan="6" bgcolor="#fffbdc"></td>
        </tr>

        <tr height="50">
            <td rowspan="4" bgcolor="#fffbdc"></td>
            <td colspan="4" bgcolor="#20e8c0"></td>
            <td rowspan="4" bgcolor="#fffbdc"></td>
        </tr>

        <tr height="50">
            <td rowspan="2" bgcolor="#fffbdc"></td>
            <td bgcolor="red"></td>
            <td bgcolor="blue"></td>
            <td rowspan="2" bgcolor="#fffbdc"></td>
        </tr>

        <tr height="50">
            <td bgcolor="lime"></td>
            <td bgcolor="yellow"></td>
        </tr>

        <tr height="50">
            <td colspan="4" bgcolor="#20e8c0"></td>
        </tr>

        <tr height="50">
            <td colspan="6" bgcolor="#20e8c0"></td>
        </tr>

        <tr height="50">
            <td colspan="8" bgcolor="#20e8c0"></td>
        </tr>
        </tbody>
    </table>

    <p>
        <a href="../index.html">Повернутись на головну</a>
    </p>

</div>

</body>
</html>
