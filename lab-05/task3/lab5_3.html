<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Анкета користувача</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h1>Анкета користувача</h1>

    <form action="" method="POST" enctype="multipart/form-data">

        <fieldset>
            <legend>Особисті дані</legend>

            <div class="form-group">
                <label for="username">ПІБ:</label>
                <input type="text" id="username" name="username" placeholder="Іванов Іван Іванович" required tabindex="1">
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Password1" required tabindex="2">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" autocomplete="off" required tabindex="3">
            </div>

            <div class="form-group">
                <label for="phone">Номер телефону:</label>
                <input type="tel" id="phone" name="phone" placeholder="+380991234567" required tabindex="4">
            </div>

            <div class="form-group">
                <label for="birthdate">Дата народження:</label>
                <input type="date" id="birthdate" name="birthdate" required tabindex="5">
            </div>
        </fieldset>

        <fieldset>
            <legend>Опитування</legend>

            <div class="form-group">
                <label>Рівень освіти:</label>
                <div class="radio-group">
                    <label><input type="radio" name="education" value="middle" tabindex="6"> Середня</label>
                    <label><input type="radio" name="education" value="bachelor" tabindex="7"> Бакалавр</label>
                    <label><input type="radio" name="education" value="master" tabindex="8"> Магістр</label>
                </div>
            </div>

            <div class="form-group">
                <label>Форма навчання:</label>
                <div class="radio-group">
                    <label><input type="radio" name="study_form" value="day" tabindex="9"> Денна</label>
                    <label><input type="radio" name="study_form" value="extramural" checked tabindex="10"> Заочна</label>
                    <label><input type="radio" name="study_form" value="distance" tabindex="11"> Дистанційна</label>
                </div>
            </div>

            <div class="form-group">
                <label>Ваші зацікавлення:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="interests" value="programming" tabindex="12"> Програмування</label>
                    <label><input type="checkbox" name="interests" value="design" tabindex="13"> Дизайн</label>
                    <label><input type="checkbox" name="interests" value="sports" tabindex="14"> Спорт</label>
                    <label><input type="checkbox" name="interests" value="music" tabindex="15"> Музика</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Списки та вибір</legend>

            <div class="form-group">
                <label for="city">Рідне місто:</label>
                <select id="city" name="city" tabindex="16">
                    <option value="kyiv">Київ</option>
                    <option value="lviv">Львів</option>
                    <option value="odesa" selected>Одеса</option>
                    <option value="kharkiv">Харків</option>
                    <option value="dnipro">Дніпро</option>
                </select>
            </div>
            <div class="form-group">
                <label for="languages">Мови, якими володієте:</label>
                <select id="languages" name="languages[]" multiple size="4" tabindex="17">
                    <option value="ua">Українська</option>
                    <option value="en">Англійська</option>
                    <option value="de">Німецька</option>
                    <option value="fr">Французька</option>
                    <option value="es">Іспанська</option>
                    <option value="pl">Польська</option>
                </select>
            </div>

            <div class="form-group">
                <label for="course">Вибір навчального курсу:</label>
                <select id="course" name="course" tabindex="18">
                    <optgroup label="Web Development">
                        <option value="html_css">HTML/CSS</option>
                        <option value="js">JavaScript</option>
                        <option value="react">React</option>
                    </optgroup>
                    <optgroup label="Backend">
                        <option value="csharp">C# / .NET</option>
                        <option value="python">Python</option>
                        <option value="node">Node.js</option>
                    </optgroup>
                    <optgroup label="Mobile">
                        <option value="flutter">Flutter</option>
                        <option value="swift">Swift</option>
                        <option value="kotlin">Kotlin</option>
                    </optgroup>
                    <optgroup label="Database">
                        <option value="sql">PostgreSQL</option>
                        <option value="mongo">MongoDB</option>
                        <option value="sqlite">SQLite</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="browser">Улюблений браузер:</label>
                <input list="browsers" id="browser" name="browser" placeholder="Оберіть або введіть..." tabindex="19">
                <datalist id="browsers">
                    <option value="Google Chrome">
                    <option value="Mozilla Firefox">
                    <option value="Microsoft Edge">
                    <option value="Safari">
                    <option value="Opera">
                </datalist>
            </div>
        </fieldset>

        <fieldset>
            <legend>Додаткові матеріали</legend>

            <div class="form-group">
                <label for="bio">Про себе:</label>
                <textarea id="bio" name="bio" rows="4" cols="40" placeholder="Розкажіть декілька слів про себе..." tabindex="20"></textarea>
            </div>

            <div class="form-group">
                <label for="audio_files">Завантажити аудіо-файли:</label>
                <input type="file" id="audio_files" name="audio_files[]" accept="audio/*" multiple tabindex="21">
            </div>
        </fieldset>

        <div class="button-group">
            <button type="submit" tabindex="22">Надіслати</button>
            <button type="reset" tabindex="23">Очистити</button>
        </div>

    </form>

    <div class="back-link">
        <a href="../../lab-03/index.html">Повернутись на головну</a>
    </div>
</div>

</body>
</html>
